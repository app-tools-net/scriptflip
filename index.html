<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ScriptFlip | Fill-in-the-Blanks Message Generator</title>
  <meta name="description" content="ScriptFlip helps you write polite, stress-free messages for awkward life situations.">
  <style>
    :root{--bg:#f8fafc;--surface:#fff;--text:#0f172a;--muted:#64748b;--primary:#4f46e5;--border:#e2e8f0;--r:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;}
    .wrap{width:100%;max-width:520px;margin:28px auto;padding:18px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:0 4px 10px rgba(2,6,23,0.04)}
    h1{color:var(--primary);font-size:1.25rem;margin-bottom:12px}
    label{font-size:0.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    select,input{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid var(--border);background:#fafafa}
    .btn{display:inline-block;background:var(--primary);color:#fff;padding:10px 14px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
    .out{background:#f1f5f9;border-radius:10px;padding:12px;margin-top:12px;min-height:76px;border:1px solid var(--border);white-space:pre-wrap}
    footer{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
    @media (max-width:420px){.wrap{padding:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>✍️ ScriptFlip</h1>
      <div>
        <label for="scenario">Select your situation</label>
        <select id="scenario"></select>
      </div>
      <div id="fields"></div>
      <div style="display:flex;gap:8px;margin-top:12px;align-items:center">
        <button id="copyBtn" class="btn">Copy to Clipboard</button>
      </div>
      <div id="preview" class="out">Loading…</div>
    </div>
    <footer>Privacy-first. No network calls; everything runs in your browser.</footer>
  </div>

  <script>
  (function(){
    const templates = {
      money:{
        inputs:[{id:'name',label:"Friend's name",ph:'Chris'},{id:'amount',label:'Amount owed ($)',ph:'25'},{id:'event',label:'What was it for?',ph:'concert tickets'}],
        build:v=>`Hey ${v.name}, hope you're well. Quick one — did you get a chance to send the $${v.amount} for ${v.event}? No rush, just checking in as I'm sorting my budget. Thanks!`
      },
      decline:{
        inputs:[{id:'name',label:"Person's name",ph:'Sarah'},{id:'event',label:'What is the event?',ph:'the birthday dinner on Friday'}],
        build:v=>`Hi ${v.name}, thanks so much for inviting me to ${v.event}. It sounds lovely, but I won't be able to make it this time. I hope you have a wonderful time!`
      },
      noise:{
        inputs:[{id:'time',label:'When did the noise happen?',ph:'last night around 11pm'},{id:'sound',label:'What was the sound?',ph:'loud bass from music'}],
        build:v=>`Hi neighbor — hope you're well. Just letting you know that ${v.sound} came through my walls ${v.time}. I wanted to mention it in case you're not aware. Thanks for understanding.`
      },
      cancel:{
        inputs:[{id:'name',label:"Friend's name",ph:'Alex'},{id:'event',label:'What plan are you cancelling?',ph:'our lunch catch up today'}],
        build:v=>`Hey ${v.name}, I'm really sorry but I need to cancel ${v.event} — I'm not feeling up to it today. I'm happy to reschedule when things calm down. Sorry again.`
      },
      sick:{
        inputs:[{id:'boss',label:'Manager / boss name',ph:'Terry'},{id:'coverage',label:'Coverage note',ph:'Emily will cover my tickets'}],
        build:v=>`Hi ${v.boss}, I'm unwell today and won't be able to work. I'll rest and aim to be back tomorrow. ${v.coverage ? 'Note: ' + v.coverage + '.' : ''}`
      },
      sub:{
        inputs:[{id:'company',label:'Business / gym name',ph:'Aura Fitness'},{id:'id',label:'Account / member ID',ph:'MEM-8849'}],
        build:v=>`To whom it may concern at ${v.company},\n\nPlease cancel my subscription associated with ID ${v.id}, effective immediately. Please confirm once processed.\n\nThank you.`
      },
      return:{
        inputs:[{id:'name',label:"Friend's name",ph:'Jordan'},{id:'item',label:'Borrowed item',ph:'camping tent'}],
        build:v=>`Hey ${v.name}, hope you're well. I'm sorting things this weekend and realized I need ${v.item} back. Could I pick it up or would you like to drop it off? Thanks!`
      },
      date:{
        inputs:[{id:'name',label:"Date's name",ph:'Taylor'},{id:'activity',label:'What did you do?',ph:'getting drinks last night'}],
        build:v=>`Hey ${v.name}, thanks again for ${v.activity}. I enjoyed meeting you, but I didn't feel a strong romantic connection. Wishing you all the best.`
      },
      quit:{
        inputs:[{id:'manager',label:'Manager name',ph:'Dave'},{id:'role',label:'Your position',ph:'evening assistant'},{id:'date',label:'Last day',ph:'Friday the 23rd'}],
        build:v=>`Hi ${v.manager},\n\nPlease accept this as my resignation from the position of ${v.role}, with my last day being ${v.date}. Thank you for the opportunity.`
      },
      backingout:{
        inputs:[{id:'organiser',label:'Organiser / group',ph:'the picnic group chat'},{id:'contribution',label:'What were you bringing?',ph:'speaker and ice'}],
        build:v=>`Hey ${v.organiser}, sorry for the late notice, but I can't handle ${v.contribution} anymore due to unexpected issues. I'm really sorry — happy to help find a replacement.`
      }
    };

    const scenario = document.getElementById('scenario');
    const fields = document.getElementById('fields');
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');

    function populateScenarios(){
      Object.keys(templates).forEach(key=>{
        const opt = document.createElement('option');
        opt.value = key; opt.textContent = key.replace(/^[a-z]/,c=>c.toUpperCase());
        scenario.appendChild(opt);
      });
    }

    function renderFields(){
      const t = templates[scenario.value];
      fields.innerHTML = '';
      t.inputs.forEach(i=>{
        const wrap = document.createElement('div');
        wrap.style.marginTop='10px';
        const lbl = document.createElement('label'); lbl.textContent = i.label; lbl.htmlFor = 'f-'+i.id;
        const inp = document.createElement('input'); inp.id = 'f-'+i.id; inp.placeholder = i.ph; inp.type='text'; inp.style.marginTop='6px';
        inp.addEventListener('input',updatePreview);
        wrap.appendChild(lbl); wrap.appendChild(inp); fields.appendChild(wrap);
      });
      updatePreview();
    }

    function values(){
      const t = templates[scenario.value];
      const vals = {};
      t.inputs.forEach(i=>{ const el = document.getElementById('f-'+i.id); vals[i.id] = (el && el.value.trim())?el.value.trim():i.ph; });
      return vals;
    }

    function updatePreview(){ preview.textContent = templates[scenario.value].build(values()); }

    copyBtn.addEventListener('click',function(){
      const text = preview.textContent || '';
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>flashCopied(),()=>fallbackCopy(text));
      } else fallbackCopy(text);
    });

    function fallbackCopy(text){
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); flashCopied(); }catch(e){ alert('Copy failed — select and copy manually.'); }
      ta.remove();
    }

    function flashCopied(){ copyBtn.textContent='Copied!'; copyBtn.style.background='#10b981'; setTimeout(()=>{copyBtn.textContent='Copy to Clipboard'; copyBtn.style.background=''},1200); }

    scenario.addEventListener('change',renderFields);
    populateScenarios(); scenario.value='money'; renderFields();
  })();
  </script>
</body>
</html>
